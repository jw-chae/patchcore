experiment:
  name: mvtec_dual_experiment
  seed: 0
dataset:
  name: mvtec
  root: /media/jjack/Extreme SSD/dataset/mvtec
  category: screw
  img_size: 224
  batch_size: 8
  num_workers: 2
features:
  type: dual_backbone
  seg:
    type: vit_patches
    backbone_cfg:
      type: dinov2_vit
      model_name: dinov2_vitb14
      pretrained: true
    include_cls: false
    normalize: l2
  scr:
    type: vit_scr
    backbone_cfg:
      type: openclip_vit
      model_name: ViT-B-16
      pretrained: laion400m_e32
    scr_source: cls
    scr_normalize: l2
memory:
  seg:
    type: full
    dtype: fp16
  scr:
    type: full
    dtype: fp16
scoring:
  seg:
    type: knn_l2
    k: 1
    image_agg: max
  scr:
    type: knn_l2
    k: 1
    image_agg: max
inference:
  seg:
    type: torch_knn
    device: cuda
  scr:
    type: torch_knn
    device: cuda
postprocess:
  blur_sigma: 4
  threshold:
    type: fpr_at_tpr
    tpr: 0.99
eval:
  pixel_fpr_limit: 0.3
profile:
  measure_vram: true
  measure_latency: true
log:
  backend: local
viz:
  enabled: true
  topk: 8
  alpha: 0.5
cam:
  enabled: false
  topk: 8
  alpha: 0.5
